<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2a4a" />
    <meta
      name="description"
      content="Drive your own transport company. Pick up passengers, earn coins, and grow your fleet."
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Transport Simulator</title>

    <!-- Inline so the page never makes an external request for it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚍</text></svg>"
    />

    <style>
      :root {
        color-scheme: dark;
        --sky: #1b2a4a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sky);
        /* Kids drag and double-tap constantly; none of it should scroll or zoom. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        display: block;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* Shown until the first frame renders, then removed by the bootstrap. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        justify-items: center;
        background: var(--sky);
        color: #ffd166;
        transition: opacity 400ms ease;
      }

      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot .mark {
        font-size: clamp(3rem, 12vw, 6rem);
        animation: bob 1.4s ease-in-out infinite;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }
        50% {
          transform: translateY(-12px) rotate(3deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .mark {
          animation: none;
        }
      }

      #boot .bar {
        width: min(60vw, 320px);
        height: 12px;
        border-radius: 999px;
        background: #ffffff22;
        overflow: hidden;
      }

      #boot .bar span {
        display: block;
        height: 100%;
        width: 30%;
        border-radius: 999px;
        background: #ffd166;
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }

      noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 2rem;
        text-align: center;
        color: #fff;
        font-size: 1.25rem;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="boot" role="status" aria-label="Loading">
      <div class="mark">🚍</div>
      <div class="bar"><span></span></div>
    </div>

    <noscript>This game needs JavaScript turned on.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
