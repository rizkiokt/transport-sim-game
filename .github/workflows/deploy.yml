name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the test suite: a red build must never reach the
      # published site. `npm run build` also runs the typecheck.
      - run: npm test

      # And on an actual playthrough. Unit tests cannot tell us a child could
      # complete a ride; this drives the real physics in a real browser and
      # asserts a passenger gets picked up, delivered, and paid for.
      - name: End-to-end playtest
        run: |
          npx vite --port 5175 --strictPort &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5175/ && break
            sleep 1
          done
          npm run playtest -- http://localhost:5175/ playtest.png

      - name: Upload playtest screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playtest-screenshot
          path: playtest.png
          if-no-files-found: ignore

      - run: npm run build
        env:
          # Project sites live at /<repo>/; ${{ github.event.repository.name }}
          # keeps this correct even if the repo is renamed.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
